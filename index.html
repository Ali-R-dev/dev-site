    <script>
      (function () {
        const storageKey = "theme-preference";
        const themeMeta = {
          "dark-plus": { colorScheme: "dark", themeColor: "#1e1e1e" },
          "light-plus": { colorScheme: "light", themeColor: "#ffffff" },
          "hc-black": { colorScheme: "dark", themeColor: "#000000" },
          "one-dark-pro": { colorScheme: "dark", themeColor: "#282c34" },
          "dracula": { colorScheme: "dark", themeColor: "#282a36" },
          "monokai": { colorScheme: "dark", themeColor: "#272822" },
          "github-dark": { colorScheme: "dark", themeColor: "#0d1117" },
          "github-light": { colorScheme: "light", themeColor: "#ffffff" },
          "solarized-dark": { colorScheme: "dark", themeColor: "#002b36" },
          "solarized-light": { colorScheme: "light", themeColor: "#fdf6e3" },
        };
        const themeAliases = {
          dark: "dark-plus",
          light: "light-plus",
          "high-contrast": "hc-black",
          hc: "hc-black",
        };

        const normalizePreference = (value) => {
          if (value === "system") return "system";
          if (themeMeta[value]) return value;
          if (themeAliases[value]) return themeAliases[value];
          return "system";
        };

        let storedPreference = "system";
        try {
          storedPreference = normalizePreference(localStorage.getItem(storageKey));
        } catch {}

        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolvedTheme =
          storedPreference === "system"
            ? prefersDark
              ? "dark-plus"
              : "light-plus"
            : storedPreference;

        const themeInfo = themeMeta[resolvedTheme] || themeMeta["dark-plus"];
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.classList.toggle("dark", themeInfo.colorScheme === "dark");
        document.documentElement.style.colorScheme = themeInfo.colorScheme;

        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", themeInfo.themeColor);
        }
      })();
    </script>
